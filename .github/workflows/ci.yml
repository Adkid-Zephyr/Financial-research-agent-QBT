name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run research-agent tests
        env:
          DATABASE_URL: ""
        run: python -m unittest discover -s tests -v
      - name: Run report-review tests
        env:
          DATABASE_URL: ""
        run: python -m unittest discover -s report_review_agent/tests -v
